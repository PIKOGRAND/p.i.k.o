<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P.I.K.O</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  h1 {
    font-size: clamp(4rem, 12vw, 10rem);
    letter-spacing: 0.15em;
    font-weight: 300;
    margin-bottom: 0.2em;
  }
  h1 span { color: #d4af37; }
  p {
    font-size: 1.2rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 3rem;
  }
  .line {
    width: 80px;
    height: 1px;
    background: #d4af37;
    margin: 2rem auto;
  }
  footer {
    position: absolute;
    bottom: 2rem;
    font-size: 0.8rem;
    color: #555;
    letter-spacing: 0.2em;
  }
</style>
</head>
<body>
  <h1>P<span>.</span>I<span>.</span>K<span>.</span>O</h1>
  <div class="line"></div>
